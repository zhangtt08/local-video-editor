[project]
name = "agentcut"
version = "0.1.0"
description = "Local-first editing engine for agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "mcp>=1.28,<2",
  # Offline speech recognition for auto captions; the model folders are data, not code.
  "vosk>=0.3.45,<0.4",
]

[project.scripts]
agentcut = "agentcut.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcut"]

[dependency-groups]
# `scripts/build_engine.py` freezes the engine with PyInstaller. It used to be installed into the
# venv by hand, and every `uv sync` silently pruned it — two release chains ran to the end with a
# stale engine before the package gates caught it. A build tool the repo's own script needs is a
# dev dependency, not a local habit.
dev = ["ruff>=0.11,<1", "pyinstaller>=6.22,<7"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
